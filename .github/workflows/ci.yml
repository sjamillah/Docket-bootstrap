name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Keyed on requirements.txt, so cfn-lint comes from cache.
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # One flat template with no children, so there is nothing to package.
      # Git sync deploys it; this only checks it is valid before that.
      - name: Lint
        run: make lint

AWSTemplateFormatVersion: '2010-09-09'
Description: docket bootstrap - the roles Git sync assumes, and where templates are staged

# Deployed once by hand, then adopted by Git sync from this repository.
# Everything it creates is published to Parameter Store; nothing downstream
# is configured by copying a value out of the Outputs below.

Parameters:

  ProjectName:
    Type: String
    Default: docket
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'

  GitHubOrg:
    Type: String
    ConstraintDescription: >-
      Must match the owner in the repository URL exactly. The subject claim is
      compared with StringLike and no case folding.
    Description: Organisation or username that owns both repositories.

  GitHubInfraRepo:
    Type: String
    Default: Docket-infra

  GitHubAppRepo:
    Type: String
    Default: Docket-app

  GitHubBranch:
    Type: String
    Default: main
    Description: >-
      The only branch permitted to assume the Actions role. Must match
      on.push.branches in the workflow and the Git sync branch.

  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be an email address.
    Description: >-
      Where CloudWatch alarms are delivered. Published to Parameter Store so
      the main stack resolves it rather than carrying an address in git.

  CreateOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      One provider per URL per account. Leave false if the GitHub one already
      exists; check with aws iam list-open-id-connect-providers.

Conditions:
  NeedsOidcProvider: !Equals
    - !Ref CreateOidcProvider
    - 'true'

Resources:

  # --- Template staging -----------------------------------------------------

  TemplateBucket:
    Type: AWS::S3::Bucket
    # Delete, not Retain: nothing in here is precious. S3 will not drop a
    # bucket that still holds objects, so teardown empties it first.
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-templates-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TemplateBucket.Arn
              - !Sub '${TemplateBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # Read by the Makefile, so templates land where main.yaml looks for them.
  TemplateBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/template-bucket'
      Type: String
      Value: !Ref TemplateBucket

  # --- Identity -------------------------------------------------------------

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: NeedsOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubInfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-gha-infra'
      Description: GitHub Actions in the infrastructure repo, staging templates to S3
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - NeedsOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                # Without the aud check, any GitHub repo could present a token.
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # GitHub appends numeric ids so the claim survives a rename.
                # Both shapes accepted; the literal @ anchors the wildcard.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubInfraRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubInfraRepo}@*:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: stage-templates
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${TemplateBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                Resource: !GetAtt TemplateBucket.Arn

              # Where to stage. CI only writes templates; Git sync deploys them.
              - Effect: Allow
                Action: 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/template-bucket'

  # Sibling of GitHubInfraRole above: both are CI identity, so both live here
  # rather than in the stack they happen to grant access to. Everything it
  # names is derived from ProjectName, so this has no dependency on the main
  # stack and can be created before ECR or the artifact bucket exist.
  GitHubAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-gha-app'
      Description: GitHub Actions in the application repo, pushing images and deploy config
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - NeedsOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # GitHub appends numeric ids on rename; the literal @ anchors it.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubAppRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubAppRepo}@*:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthTokenIsAccountWide
                Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Sid: PushToThisRepositoryOnly
                Effect: Allow
                Action:
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:UploadLayerPart'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:PutImage'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}'

        - PolicyName: publish-deploy-config
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # taskdef.json and appspec.yaml, zipped. The pipeline reads this
              # object; the app repo is the only thing that writes it.
              - Sid: UploadDeployConfig
                Effect: Allow
                Action: 's3:PutObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}/config/*'

              # Everything the workflow renders into taskdef.json, published
              # by whichever stack creates the thing it names.
              - Sid: ResolvePublishedNames
                Effect: Allow
                Action: 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'

  # Assumed by CloudFormation to build the stacks. Nothing else can use it.
  CfnDeploymentRole:
    Type: AWS::IAM::Role
    # Retained: deleting it partway strands the stack delete.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ProjectName}-cfn-deployment'
      Description: Assumed by CloudFormation to provision the docket stacks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: provision-project-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Broad within each service, but nothing outside this list.
              - Sid: ProjectServices
                Effect: Allow
                Action:
                  - 'ec2:*'
                  - 'ecs:*'
                  - 'lambda:*'
                  - 'ecr:*'
                  - 'elasticloadbalancing:*'
                  - 'rds:*'
                  - 'elasticache:*'
                  - 's3:*'
                  - 'secretsmanager:*'
                  - 'logs:*'
                  - 'cloudwatch:*'
                  - 'application-autoscaling:*'
                  - 'codedeploy:*'
                  - 'codepipeline:*'
                  - 'codeconnections:*'
                  - 'codestar-connections:*'
                  - 'events:*'
                  - 'sns:*'
                  - 'cloudformation:*'
                  # Write and delete too: this stack creates the two template
                  # parameters, so it has to be able to remove them again.
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:DescribeParameters'
                  - 'ssm:PutParameter'
                  - 'ssm:DeleteParameter'
                  - 'ssm:AddTagsToResource'
                  - 'ssm:RemoveTagsFromResource'
                  - 'ssm:ListTagsForResource'
                Resource: '*'

              # AWS managed keys only. ViaService stops the role reaching a key alone.
              - Sid: EncryptionThroughTheseServicesOnly
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                  - 'kms:GenerateDataKey'
                  - 'kms:CreateGrant'
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService':
                      - !Sub 'rds.${AWS::Region}.amazonaws.com'
                      - !Sub 'elasticache.${AWS::Region}.amazonaws.com'
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      - !Sub 's3.${AWS::Region}.amazonaws.com'

              # Scoped by name prefix: it cannot mint arbitrary roles.
              - Sid: ManageProjectRolesOnly
                Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:DeleteRole'
                  - 'iam:GetRole'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                  - 'iam:ListRoleTags'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:UpdateAssumeRolePolicy'
                  - 'iam:PassRole'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'

              - Sid: ReadOnlyIam
                Effect: Allow
                Action:
                  - 'iam:ListRoles'
                  - 'iam:ListPolicies'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                Resource: '*'

              - Sid: CreateServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName':
                      - ecs.amazonaws.com
                      - rds.amazonaws.com
                      - elasticache.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com

        # Global services carry no regional context; the rest is pinned.
        - PolicyName: region-lock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                NotAction:
                  - 'iam:*'
                  - 'sts:*'
                  - 's3:GetBucketLocation'
                  - 'route53:*'
                  - 'support:*'
                Resource: '*'
                Condition:
                  StringNotEquals:
                    'aws:RequestedRegion': !Ref AWS::Region

  # Assumed by Git sync to read the repository and drive CloudFormation.
  GitSyncRole:
    Type: AWS::IAM::Role
    # Retained for the same reason as CfnDeploymentRole above.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ProjectName}-gitsync'
      Description: Assumed by CloudFormation Git sync to deploy from the repository
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.sync.codeconnections.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: gitsync-operations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadTheRepository
                Effect: Allow
                Action:
                  - 'codeconnections:UseConnection'
                  - 'codestar-connections:UseConnection'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/*'
                  - !Sub 'arn:${AWS::Partition}:codestar-connections:${AWS::Region}:${AWS::AccountId}:connection/*'
              - Sid: DriveCloudFormation
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:ListChangeSets'
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:UpdateStack'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:DescribeStackEvents'
                  - 'cloudformation:DescribeStackResource'
                  - 'cloudformation:DescribeStackResources'
                  - 'cloudformation:GetTemplate'
                  - 'cloudformation:GetTemplateSummary'
                  - 'cloudformation:ValidateTemplate'
                  - 'cloudformation:TagResource'
                  - 'cloudformation:UntagResource'
                Resource: '*'
              - Sid: ReadStagedTemplates
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt TemplateBucket.Arn
                  - !Sub '${TemplateBucket.Arn}/*'
              # Git sync generates this rule's name, so it cannot be scoped.
              - Sid: ManageTheSyncEventRule
                Effect: Allow
                Action:
                  - 'events:PutRule'
                  - 'events:PutTargets'
                  - 'events:DescribeRule'
                  - 'events:ListTargetsByRule'
                  - 'events:DeleteRule'
                  - 'events:RemoveTargets'
                  - 'events:EnableRule'
                  - 'events:DisableRule'
                  - 'events:TagResource'
                  - 'events:UntagResource'
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'

              - Sid: HandOffToTheDeploymentRole
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CfnDeploymentRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

  # --- S3 prefix list -------------------------------------------------------

  # The S3 gateway endpoint is reached over the route table rather than an ENI,
  # so egress to it can only be expressed as a prefix list. AWS assigns the id
  # per region and no resource returns it, which is why it used to be typed
  # into a deployment file. Looking it up removes the last value anyone had to
  # find by hand.

  PrefixListLookupLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-prefix-list-lookup'
      RetentionInDays: 7

  PrefixListLookupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-prefix-list-lookup'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: describe-prefix-lists
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only, and the only call this function makes.
              - Effect: Allow
                Action: 'ec2:DescribeManagedPrefixLists'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !GetAtt PrefixListLookupLogGroup.Arn

  PrefixListLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-prefix-list-lookup'
      Description: Resolves this region's S3 gateway endpoint prefix list id
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt PrefixListLookupRole.Arn
      LoggingConfig:
        LogGroup: !Ref PrefixListLookupLogGroup
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              # Nothing is created, so there is nothing to undo.
              if event["RequestType"] == "Delete":
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  region = event["ResourceProperties"]["Region"]
                  name = "com.amazonaws." + region + ".s3"
                  found = boto3.client("ec2").describe_managed_prefix_lists(
                      Filters=[{"Name": "prefix-list-name", "Values": [name]}]
                  )["PrefixLists"]
                  if not found:
                      raise RuntimeError("no managed prefix list named " + name)
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {"PrefixListId": found[0]["PrefixListId"]},
                      physicalResourceId=name,
                  )
              except Exception as exc:
                  # Without this a failure hangs the stack for an hour.
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {}, reason=str(exc)
                  )

  S3PrefixList:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PrefixListLookupFunction.Arn
      # Present so a region change re-runs the lookup instead of reusing it.
      Region: !Ref AWS::Region

  # --- Published for the main stack and CI ----------------------------------

  # Every value below is read with {{resolve:ssm}} or AWS::SSM::Parameter::Value
  # rather than pasted into a console or a workflow secret. The stack that
  # creates the resource is the stack that publishes its identifier.

  AlertEmailParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/alert-email'
      Type: String
      Value: !Ref AlertEmail

  S3PrefixListIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/s3-prefix-list-id'
      Type: String
      Value: !GetAtt S3PrefixList.PrefixListId

  GitHubAppRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/gha-app-role-arn'
      Type: String
      Value: !GetAtt GitHubAppRole.Arn

  GitHubInfraRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/gha-infra-role-arn'
      Type: String
      Value: !GetAtt GitHubInfraRole.Arn

  CfnDeploymentRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/cfn-deployment-role-arn'
      Type: String
      Value: !GetAtt CfnDeploymentRole.Arn

  GitSyncRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/gitsync-role-arn'
      Type: String
      Value: !GetAtt GitSyncRole.Arn

Outputs:
  TemplateBucketName:
    Value: !Ref TemplateBucket

  GitHubInfraRoleArn:
    Description: Set as secret AWS_ROLE_ARN in the infrastructure repository
    Value: !GetAtt GitHubInfraRole.Arn

  GitHubAppRoleArn:
    Description: Set as secret AWS_ROLE_ARN in the application repository
    Value: !GetAtt GitHubAppRole.Arn

  CfnDeploymentRoleArn:
    Description: Nominate as the stack operations role when configuring Git sync
    Value: !GetAtt CfnDeploymentRole.Arn

  GitSyncRoleArn:
    Description: Nominate as the Git sync role when configuring Git sync
    Value: !GetAtt GitSyncRole.Arn

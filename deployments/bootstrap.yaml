# Git sync adopts the existing stack rather than creating a second one, so
# these must match what the first hand-run deploy used.
template-file-path: bootstrap.yaml

parameters:
  ProjectName: docket
  GitHubOrg: sjamillah
  GitHubInfraRepo: Docket-infra
  GitHubAppRepo: Docket-app
  GitHubBranch: main
  # false when the account already has the provider. It is account-global.
  CreateOidcProvider: 'false'
  # The only value in the project that is not either derived or a resource
  # identifier. The S3 prefix list is looked up by the stack, not typed here.
  AlertEmail: jamillah.ssozi@amalitech.com

tags:
  Project: docket
  Environment: dev
  Owner: jamillah.ssozi
  ManagedBy: cloudformation-gitsync
  CostCentre: training
